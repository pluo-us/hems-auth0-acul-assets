<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Return to App</title>
    <style>
      :root {
        --color-text: #1a1a1a;
        --color-muted: #6b7280;
        --color-border: #d4d7dc;
        --color-brand-primary: #1f2937;
        --color-background: #ffffff;

        --spacing-5: 24px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: var(--color-background);
        color: var(--color-text);
        font-family: Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--spacing-5);
      }

      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid var(--color-border);
        border-top-color: var(--color-brand-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        margin: 0;
        font-size: 15px;
        line-height: 22px;
        color: var(--color-muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="content">
      <div class="spinner" role="status" aria-label="Loading"></div>
      <p class="loading-text">Loading…</p>
    </main>

    <script>
      window.APP_LINK_CONFIG = {
        iosUrl: 'org.reactjs.native.example.hemslaunchersample.auth0://login',
        androidUrl: 'com.hemslaunchersample.auth0://login',
        webFallbackUrl: 'https://hems.qa.toyotadriverslogin.com'
      };

      (function () {
        var config = window.APP_LINK_CONFIG;
        var ua = navigator.userAgent || '';
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);

        var deepLink = '';
        if (isIOS) {
          deepLink = config.iosUrl;
        } else if (isAndroid) {
          deepLink = config.androidUrl;
        }

        var target = deepLink || config.webFallbackUrl;

        // Keep this page visible for at least 3 seconds before redirecting.
        setTimeout(function () {
          if (target) {
            window.location.assign(target);
          }
        }, 3000);
      })();
    </script>
  </body>
</html>
