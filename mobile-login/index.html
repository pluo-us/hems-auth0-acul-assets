<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Return to App</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #ffffff;
        color: #111827;
      }

      .container {
        max-width: 420px;
        padding: 24px;
        text-align: center;
      }

      .actions {
        display: none;
        margin-top: 20px;
      }

      .btn {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin: 12px 0;
        padding: 12px 16px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        background: #111827;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Returning you to the app…</h1>
      <p>If the app does not open automatically, use the button below.</p>

      <div class="actions" id="actions">
        <a class="btn" id="open-app" href="#">Open app</a>
      </div>
    </main>

    <script>
      window.APP_LINK_CONFIG = {
        iosUrl: 'org.reactjs.native.example.hemslaunchersample.auth0://login',
        androidUrl: 'com.hemslaunchersample.auth0://login',
        webFallbackUrl: 'https://hems-dev.qa.toyotadriverslogin.com'
      };

      (function () {
        var config = window.APP_LINK_CONFIG;
        var ua = navigator.userAgent || '';
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);

        var deepLink = '';
        if (isIOS) {
          deepLink = config.iosUrl;
        } else if (isAndroid) {
          deepLink = config.androidUrl;
        }

        var openAppButton = document.getElementById('open-app');
        if (openAppButton) {
          openAppButton.setAttribute('href', deepLink || config.webFallbackUrl);
        }

        if (deepLink) {
          setTimeout(function () {
            window.location.assign(deepLink);
          }, 150);
        }

        setTimeout(function () {
          var actions = document.getElementById('actions');
          if (actions) {
            actions.style.display = 'block';
          }
        }, 1200);
      })();
    </script>
  </body>
</html>
